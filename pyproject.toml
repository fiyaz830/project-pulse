[project]
name = "pulse"
version = "0.1.0"
description = "Project Pulse 2.0 — production-style retail data platform (learning project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added week by week with `uv add <pkg>` — each one is a lesson.
# Expected over time: httpx, pydantic, pydantic-settings, pyspark, delta-spark, duckdb,
# fastapi, uvicorn, faker, pandera, datacontract-cli, ollama, lancedb
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "S"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"assessments/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests", "assessments/challenges"]
addopts = "-q --strict-markers"
markers = ["integration: needs local Spark or the Chaos Mart server", "dq: data quality tests"]
